<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Mission Control</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #141b33;
    --panel-2: #1b2444;
    --line: #2a3562;
    --text: #e8ecff;
    --muted: #93a0d0;
    --accent: #6c8cff;
    --ok: #3ddc97;
    --warn: #ffb454;
    --bad: #ff6b7a;
    --launch: #b388ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1a2350 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
  }
  main { max-width: 980px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: .3px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 1rem; margin: 0 0 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: .85rem; color: var(--muted); }
  input, select {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: .95rem;
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    color: #0b1020;
    background: var(--accent);
  }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  button.go { background: var(--launch); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
  td.num { font-variant-numeric: tabular-nums; }
  td.actions { display: flex; gap: 6px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700; letter-spacing: .03em; }
  .READY { background: rgba(61,220,151,.15); color: var(--ok); }
  .INSUFFICIENT { background: rgba(255,180,84,.15); color: var(--warn); }
  .LAUNCHING { background: rgba(108,140,255,.18); color: var(--accent); animation: pulse 1s infinite; }
  .LAUNCHED { background: rgba(179,136,255,.18); color: var(--launch); }
  @keyframes pulse { 50% { opacity: .45; } }
  .empty { color: var(--muted); text-align: center; padding: 26px 0; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--line); padding: 10px 18px;
    border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw;
  }
  #toast.show { opacity: 1; }
  #toast.error { border-color: var(--bad); color: var(--bad); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 300px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog form { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  @media (prefers-reduced-motion: reduce) { .LAUNCHING { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>Space Mission Control</h1>
  <p class="sub">Frontend (this page) &rarr; Java backend &rarr; SQL database. Everything runs on your computer.</p>

  <section class="card">
    <h2>Register a mission</h2>
    <form id="registerForm">
      <label>Mission ID
        <input id="idInput" required maxlength="30" placeholder="e.g. M101" autocomplete="off">
      </label>
      <label>Available fuel (0 &ndash; 10000)
        <input id="fuelInput" required type="number" min="0" max="10000" step="any" placeholder="e.g. 7000">
      </label>
      <label>Destination
        <select id="destInput">
          <option>Mars</option>
          <option>Earth Orbit</option>
        </select>
      </label>
      <button type="submit">Register mission</button>
    </form>
  </section>

  <section class="card">
    <h2>Missions in the database</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Destination</th><th>Fuel</th><th>Required</th><th>Status</th><th>Created</th><th>Actions</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="empty" hidden>No missions yet. Register your first mission above.</p>
  </section>
</main>

<dialog id="editDialog">
  <form method="dialog" id="editForm">
    <label>New available fuel for <strong id="editId"></strong>
      <input id="editFuel" type="number" min="0" max="10000" step="any" required>
    </label>
    <div class="row">
      <button type="button" class="secondary" id="editCancel">Cancel</button>
      <button type="submit">Save</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const rowsEl = document.getElementById('rows');
const emptyEl = document.getElementById('empty');
const toastEl = document.getElementById('toast');
const editDialog = document.getElementById('editDialog');
let editingId = null;
let pollTimer = null;

function toast(message, isError) {
  toastEl.textContent = message;
  toastEl.className = 'show' + (isError ? ' error' : '');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { toastEl.className = ''; }, 3200);
}

async function api(path, method, body) {
  const res = await fetch('/api/missions' + path, {
    method: method || 'GET',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
  return data;
}

function badgeClass(status) {
  return status === 'INSUFFICIENT FUEL' ? 'INSUFFICIENT' : status;
}

function cell(text, className) {
  const td = document.createElement('td');
  td.textContent = text;
  if (className) td.className = className;
  return td;
}

function actionButton(label, className, onClick, disabled) {
  const b = document.createElement('button');
  b.textContent = label;
  b.className = className;
  b.disabled = !!disabled;
  b.addEventListener('click', onClick);
  return b;
}

async function refresh() {
  try {
    const missions = await api('');
    rowsEl.replaceChildren();
    emptyEl.hidden = missions.length > 0;

    for (const m of missions) {
      const tr = document.createElement('tr');
      tr.appendChild(cell(m.id));
      tr.appendChild(cell(m.destination));
      tr.appendChild(cell(m.fuel, 'num'));
      tr.appendChild(cell(m.requiredFuel, 'num'));

      const statusTd = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = 'badge ' + badgeClass(m.status);
      badge.textContent = m.status;
      statusTd.appendChild(badge);
      tr.appendChild(statusTd);

      tr.appendChild(cell(m.createdAt.slice(0, 19)));

      const actions = document.createElement('td');
      actions.className = 'actions';
      const locked = m.status === 'LAUNCHED' || m.status === 'LAUNCHING';
      actions.appendChild(actionButton('Launch', 'go', () => launch(m.id), locked));
      actions.appendChild(actionButton('Edit fuel', 'secondary', () => openEdit(m), locked));
      actions.appendChild(actionButton('Delete', 'danger', () => remove(m.id)));
      tr.appendChild(actions);
      rowsEl.appendChild(tr);
    }

    // Keep refreshing every second while any mission is counting down.
    const busy = missions.some(m => m.status === 'LAUNCHING');
    if (busy && !pollTimer) pollTimer = setInterval(refresh, 1000);
    if (!busy && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  } catch (err) {
    toast(err.message, true);
  }
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const m = await api('', 'POST', {
      id: document.getElementById('idInput').value,
      fuel: document.getElementById('fuelInput').value,
      destination: document.getElementById('destInput').value
    });
    toast('Mission ' + m.id + ' registered and saved to the database.');
    e.target.reset();
    refresh();
  } catch (err) { toast(err.message, true); }
});

async function launch(id) {
  try {
    await api('/' + encodeURIComponent(id) + '/launch', 'POST');
    toast('Launch sequence started for ' + id + '...');
    refresh();
  } catch (err) { toast(err.message, true); }
}

async function remove(id) {
  if (!confirm('Delete mission ' + id + '?')) return;
  try {
    await api('/' + encodeURIComponent(id), 'DELETE');
    toast('Mission ' + id + ' deleted.');
    refresh();
  } catch (err) { toast(err.message, true); }
}

function openEdit(m) {
  editingId = m.id;
  document.getElementById('editId').textContent = m.id;
  document.getElementById('editFuel').value = m.fuel;
  editDialog.showModal();
}

document.getElementById('editCancel').addEventListener('click', () => editDialog.close());

document.getElementById('editForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('/' + encodeURIComponent(editingId), 'PUT',
              { fuel: document.getElementById('editFuel').value });
    editDialog.close();
    toast('Mission ' + editingId + ' updated.');
    refresh();
  } catch (err) { toast(err.message, true); }
});

refresh();
</script>
</body>
</html>
